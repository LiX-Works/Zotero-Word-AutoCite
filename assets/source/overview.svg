<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" font-family="Arial,Helvetica,sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Zotero Word AutoCite overview</title>
<desc id="desc">Your citation plan, your references (Zotero items or PDFs), and your Word manuscript go to an AI agent, which matches references, inserts Zotero fields, refreshes in Word, and verifies the bibliography. The result is a Word document with live, refreshable Zotero citation fields and bibliography; existing citations can be adjusted and refreshed again. The page is a stylized illustration.</desc>
